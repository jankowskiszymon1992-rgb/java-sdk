<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Elektron</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #eab308 0%, #f59e0b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #1f2937;
            margin-bottom: 15px;
            font-size: 28px;
        }
        
        p {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        .status {
            background: #fef3c7;
            color: #92400e;
            padding: 12px 20px;
            border-radius: 10px;
            display: inline-block;
            font-weight: 500;
        }
        
        .retry-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: #eab308;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .retry-btn:hover {
            background: #d97706;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚡</div>
        <h1>Brak połączenia z internetem</h1>
        <p>Nie martw się! Elektron działa offline. Twoje zmiany zostaną automatycznie zsynchronizowane, gdy wrócisz do zasięgu.</p>
        <div class="status">📱 Tryb offline aktywny</div>
        <button class="retry-btn" onclick="window.location.reload()">Spróbuj ponownie</button>
    </div>
</body>
</html>
